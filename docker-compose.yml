services:
  api:
    build:
      context: ./api
    image: devsecops-api
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
    image: devsecops-portfolio
    ports:
      - "3000:8080"
    environment:
      - API_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true