---
- name: Installer des packages de base
  hosts: all
  become: true

  tasks:
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer git, curl et tree
      ansible.builtin.apt:
        name:
          - git
          - curl
          - tree
        state: present